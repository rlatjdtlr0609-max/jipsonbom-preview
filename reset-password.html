<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://ohwkywomdqgcnptsnhwk.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>집손봄 개발용 비밀번호 재설정</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172341;background:#f6f7fc;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:38px 16px}main{width:min(100%,480px);margin:30px auto;padding:30px;background:white;border-radius:19px;box-shadow:0 7px 26px #16203a14}.brand{font-size:14px;font-weight:800;color:#7549c4}h1{font-size:25px;line-height:1.35;margin:13px 0}p{line-height:1.55;color:#53617a}.note{font-size:13px;color:#68758b}label{display:block;margin-top:17px;font-weight:700;font-size:14px}input{width:100%;margin-top:8px;border:1px solid #cfd5e4;border-radius:9px;padding:14px;font:inherit}input:focus{outline:3px solid #dbd0ff;border-color:#7952c6}button{margin-top:20px;display:block;width:100%;border:0;border-radius:11px;background:#7343c4;color:white;padding:15px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#6841b8}#status{min-height:1.6em;margin-top:16px;font-size:14px;white-space:pre-wrap}.ok{color:#13633a!important}.error{color:#b42331!important}.hidden{display:none}.foot{font-size:12px;color:#68758b;text-align:center;margin-top:25px}
</style>
<script src="./reset-password.js" defer></script>
</head>
<body>
<main>
<div class="brand">집손봄 · 개발환경 계정 관리</div>
<h1>비밀번호 재설정</h1>
<p>집손봄 테스트 계정 A/B의 비밀번호를 안전하게 변경합니다. 비밀번호는 이 페이지에서 Supabase 인증 서버로만 전송됩니다.</p>
<section id="request-section" class="hidden">
<p>비밀번호 재설정 이메일을 새로 받으려면 계정 이메일을 입력하세요.</p>
<label for="email">계정 이메일</label><input id="email" type="email" autocomplete="email" placeholder="이메일 입력">
<button type="button" id="request">변경 이메일 보내기</button>
<p class="note">이메일이 오면 가장 최근 메시지의 ‘Reset password’를 클릭하세요.</p>
</section>
<section id="change-section" class="hidden">
<p>이메일의 인증 링크가 확인되었습니다. 새 비밀번호를 설정하세요.</p>
<label for="password">새 비밀번호 (12자 이상)</label><input id="password" type="password" autocomplete="new-password" minlength="12">
<label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" minlength="12">
<button type="button" id="change">비밀번호 변경 완료</button>
</section>
<p id="status" role="status" aria-live="polite">인증 링크 확인 중…</p>
<div class="foot">비밀번호·인증 토큰을 저장하거나 GitHub에 업로드하지 않습니다.</div>
</main>
</body>
</html>
