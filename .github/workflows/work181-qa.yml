name: WORK181 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work181-visit-calendar-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WORK181 only
        run: |
          node --check work181-calendar.mjs
          node --test tests/work181-calendar.test.mjs
