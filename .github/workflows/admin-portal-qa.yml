name: WORK103-124 fixed-link admin 24-screen task commands, 10pct finance and mobile QA
on:
  push:
    branches:
      - main
      - feature/work103-106-admin-auth-portal-20261126
      - feature/work107-112-admin-fixed-link-20261126
      - feature/work113-118-admin-list-ui-20261126
      - feature/work119-124-admin-action-console-20261126
      - feature/work160-fixed-admin-mfa-20261126
      - feature/work161-admin-password-recovery-20261126
      - fix/work162-admin-mfa-405-login-20261126
    paths:
      - admin.html
      - admin.css
      - admin.js
      - index.html
      - tests/admin-portal.qa.mjs
      - tests/admin-task-command.qa.mjs
      - tests/admin-mfa-enroll.qa.mjs
      - tests/admin-password-recovery.qa.mjs
      - .github/workflows/admin-portal-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and static secret guard
        run: |
          node --check admin.js
          node --check tests/admin-portal.qa.mjs
          node --check tests/admin-task-command.qa.mjs
          node --check tests/admin-mfa-enroll.qa.mjs
          node --check tests/admin-password-recovery.qa.mjs
          ! grep -REi '(sb_secret_|service[_-]?role[_-]?key|BEGIN PRIVATE KEY)' admin.js admin.html admin.css
          grep -F "connect-src https://ohwkywomdqgcnptsnhwk.supabase.co" admin.html
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real browser MFA and public portal safety
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jsb-admin-portal-http.log 2>&1 &
          sleep 2
          node tests/admin-portal.qa.mjs
          node tests/admin-task-command.qa.mjs
          node tests/admin-mfa-enroll.qa.mjs
          node tests/admin-password-recovery.qa.mjs
          node tests/mobile-qa.mjs
