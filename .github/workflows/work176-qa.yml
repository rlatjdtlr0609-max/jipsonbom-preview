name: WORK176 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work176-customer-session-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Serve isolated branch for synthetic auth mock
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/work176.log 2>&1 &
          sleep 2
      - name: Validate WORK176 only
        env:
          JSB_QA_BROWSER_CHANNEL: chrome
        run: |
          node --check customer-dev.js
          node --check tests/work176-auth-denial.qa.mjs
          node tests/work165-customer-dev.qa.mjs
          node tests/work171-customer-owner.qa.mjs
          node tests/work176-auth-denial.qa.mjs
