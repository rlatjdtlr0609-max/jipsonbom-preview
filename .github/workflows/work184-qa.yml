name: WORK184 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work184-admin-coverage-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WORK184 only
        run: |
          node --check work184-admin-coverage.mjs
          node --test tests/work184-admin-coverage.test.mjs
          node --test tests/work174-admin-contract.test.mjs
