name: MASTER11 benefits and campaign public-preview QA
on:
  push:
    branches:
      - feature/master11-benefits-campaigns-20261124
      - main
    paths:
      - index.html
      - programs.css
      - programs.js
      - tests/programs-qa.mjs
      - .github/workflows/programs-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify #10/#16, existing seven screens and mobile layout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jsb-public-qa.log 2>&1 &
          sleep 2
          node tests/programs-qa.mjs
          node tests/mobile-qa.mjs
