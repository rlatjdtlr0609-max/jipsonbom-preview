name: WORK183 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work183-org-scope-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WORK183 only
        run: |
          node --check work183-org-security.mjs
          node --test tests/work183-org-security.test.mjs
