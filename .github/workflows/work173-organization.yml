name: WORK173 repair organization membership and calendar NO DEPLOY
on:
  push:
    branches: [feature/work173-org-assignments-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  organization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Local-only test web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/work17x-http.log 2>&1 &
          sleep 2
      - name: Owner scope accepted worker and overlapping assignment guard
        env:
          JSB_QA_BROWSER_CHANNEL: chrome
        run: |
          node --check work173-org-assignments.mjs
          node --test tests/work173-org-assignments.test.mjs tests/work168-org-boundary.test.mjs
          node tests/work168-org-panel.qa.mjs
