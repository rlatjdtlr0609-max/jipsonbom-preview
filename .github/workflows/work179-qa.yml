name: WORK179 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work179-worker-claims-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WORK179 only
        run: |
          node --check work179-claims.mjs
          node --test tests/work179-claims.test.mjs
