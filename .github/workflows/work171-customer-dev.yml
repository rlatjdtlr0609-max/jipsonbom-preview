name: WORK171 customer owner and session safety NO DEPLOY
on:
  push:
    branches: [feature/work171-customer-auth-intake-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Local-only test web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/work17x-http.log 2>&1 &
          sleep 2
      - name: Customer A/B and wrong-owner scenarios
        env:
          JSB_QA_BROWSER_CHANNEL: chrome
        run: |
          node --check customer-dev.js
          node --check tests/work171-customer-owner.qa.mjs
          node tests/work165-customer-dev.qa.mjs
          node tests/work166-session-security.qa.mjs
          node tests/work171-customer-owner.qa.mjs
