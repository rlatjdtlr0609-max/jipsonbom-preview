name: WORK172 worker quote booking simulated atomic cash NO DEPLOY
on:
  push:
    branches: [feature/work172-worker-matching-booking-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Local-only test web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/work17x-http.log 2>&1 &
          sleep 2
      - name: State transitions, idempotence, official cash rule and worker UI
        env:
          JSB_QA_BROWSER_CHANNEL: chrome
        run: |
          node --check work172-booking-flow.mjs
          node --test tests/work172-booking-flow.test.mjs tests/work167-worker-cash.test.mjs
          node tests/work167-worker-panel.qa.mjs
