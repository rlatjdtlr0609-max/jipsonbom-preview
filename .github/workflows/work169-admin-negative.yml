name: WORK169 administrator unauthorized access guard
on:
  push:
    branches:
      - feature/work169-admin-qa-20261126
    paths:
      - 'tests/work169-admin-negative.qa.mjs'
      - '.github/workflows/work169-admin-negative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unauthorized-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing dependency
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Run isolated local source server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jsb-local-http.log 2>&1 &
          sleep 2
      - name: Verify MFA and 24-screen fail closed access scenarios
        env:
          JSB_QA_BROWSER_CHANNEL: chrome
        run: |
          node --check tests/work169-admin-negative.qa.mjs
          node tests/work169-admin-negative.qa.mjs
