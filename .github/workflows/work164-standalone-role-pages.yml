name: WORK164 independent role fixed URLs - desktop mobile and safety
on:
  push:
    branches:
      - main
      - feature/work164-standalone-role-pages-20261126
    paths:
      - customer.html
      - worker.html
      - construction.html
      - repair-company.html
      - role-pages.js
      - role-pages.css
      - index.html
      - tests/standalone-role-pages.qa.mjs
      - .github/workflows/work164-standalone-role-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and static safety checks
        run: |
          node --check role-pages.js
          node --check tests/standalone-role-pages.qa.mjs
          ! grep -REi '(sb_secret_|service[_-]?role[_-]?key|BEGIN PRIVATE KEY)' customer.html worker.html construction.html repair-company.html role-pages.js
          grep -F "connect-src 'none'" customer.html worker.html construction.html repair-company.html
          grep -F "form-action 'none'" customer.html worker.html construction.html repair-company.html
      - name: Install isolated Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser verification of four standalone URLs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jsb-work164-http.log 2>&1 &
          sleep 2
          node tests/standalone-role-pages.qa.mjs
