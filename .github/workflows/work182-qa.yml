name: WORK182 isolated DEV verification NO DEPLOY
on:
  push:
    branches:
      - feature/work182-cash-ledger-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WORK182 only
        run: |
          node --check work182-ledger.mjs
          node --test tests/work182-ledger.test.mjs
